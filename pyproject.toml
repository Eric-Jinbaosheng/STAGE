[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-linguistic-blindness"
version = "0.1.0"
description = "Counterfactual semantic transfer and grounding evaluation for embodied agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "STAGE authors"}
]
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=12.0"]
analysis = ["numpy>=1.24", "Pillow>=10.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
